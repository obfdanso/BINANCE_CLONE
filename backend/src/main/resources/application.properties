# Secrets carry no fallback on purpose. A missing variable should stop the
# application at startup rather than let it run on a value that is readable by
# anyone with the repository. Copy env.example to .env and fill it in; .env is
# gitignored.
#
spring.application.name=bitby

# Enable dotenv import for local development
spring.config.import=optional:dotenv:

# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration - Updated for Render
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
# SQL logging is off by default. With it on, every statement (and this app
# polls market data on a schedule) is written out formatted; a few hours of
# running produced a multi-gigabyte log locally, which on a hosted instance
# means filling the disk. Turn it on per run with -Dspring.jpa.show-sql=true
# or via the local profile.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



# Security Configuration
spring.security.user.name=${SECURITY_USER_NAME:admin}
spring.security.user.password=${SECURITY_USER_PASSWORD}
# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=true

# Telegram Bot Configuration
telegram.bot.username=${TELEGRAM_BOT_USERNAME:BitbyApp_bot}
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
# JWT Configuration
bitby.app.jwtSecret=${JWT_SECRET}
bitby.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# openssl rand -base64 64 run this command in your linux terminal for a 64-byte base64-encoded string to use as your jwt secret.

# Market Data Configuration
market.data.update.interval=300000
market.data.api.coingecko.base-url=https://api.coingecko.com/api/v3

# Paystack API Keys
paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.public-key=${PAYSTACK_PUBLIC_KEY}