# Local development profile: --spring.profiles.active=local
#
# Values come from the environment so nothing real is committed. Set them in
# backend/.env (see env.example); this file only overrides behaviour that
# should differ locally.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# No SSL against a local database.
spring.jpa.properties.hibernate.connection.ssl=false

# Hibernate builds the schema from the entities, so an empty database is fine.
spring.jpa.hibernate.ddl-auto=update

# Verbose SQL is useful locally but writes a great deal; off unless asked for.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
